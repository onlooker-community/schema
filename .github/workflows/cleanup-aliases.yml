name: Cleanup NPM Aliases

on:
  delete:

jobs:
  cleanup:
    if: github.event.ref_type == 'branch' && (startsWith(github.event.ref, 'feature/') || startsWith(github.event.ref, 'feat/'))
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'

      - name: Remove NPM dist-tag
        run: |
          BRANCH_NAME=$(echo "${{ github.event.ref }}" | sed 's/refs\/heads\///g' | sed 's/\//-/g')
          npm dist-tag rm npm-demo-release-please $BRANCH_NAME || true
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_ACCESS_TOKEN }}
